<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>flatScawanger</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          15px/1.45 system-ui,
          sans-serif;
        margin: 0;
        padding: 24px;
        max-width: 980px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      select,
      input,
      button {
        font: inherit;
      }
      select,
      input[type="url"],
      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: end;
      }
      .row > label {
        flex: 1;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #log {
        white-space: pre-wrap;
        background: #111;
        color: #eee;
        padding: 12px;
        min-height: 72px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid #8884;
        padding: 6px 8px;
      }
      .muted {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <h1>flatScawanger</h1>
    <p class="muted">
      Agent waehlen, Start. Der Subagent oeffnet die Suche in einem echten Tab
      und liest die Ergebnis-Bloecke.
    </p>
    <label for="agent">Agent</label>
    <select id="agent"></select>
    <p id="hint" class="muted"></p>
    <label for="url">Such-URL</label>
    <input id="url" type="url" spellcheck="false" />
    <div class="row">
      <label
        >Seiten (1-3)
        <input id="pages" type="number" min="1" max="3" value="1" />
      </label>
      <button id="start" type="button">Start</button>
      <button id="csv" type="button" disabled>CSV exportieren</button>
    </div>
    <label>Subagent-Log</label>
    <div id="log">Noch nichts gesucht.</div>
    <table>
      <thead>
        <tr>
          <th>Titel</th>
          <th>Preis</th>
          <th>Groesse</th>
          <th>Zimmer</th>
          <th>Lage</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script src="main.js"></script>
  </body>
</html>
